name: Комментарии → директ

# Instagram разрешает написать в личку только в ответ на комментарий и
# только в течение 7 суток. Поэтому разведка отделена от отправки:
# сначала смотрим, кого мы вообще ещё успеваем догнать, и лишь потом,
# отдельным запуском с галочкой, шлём сообщения.
#
# Автоматика. В отличие от публикации, здесь точность крона не важна:
# запас — семь суток, и опоздание GitHub на пару часов ничего не портит.
# Поэтому обычное расписание, без дежурного сторожа.
#
# Рассылка по расписанию включается отдельно переменной DM_AUTOSEND=on.
# Пока её нет, ночные прогоны только считают очередь и ничего не шлют:
# первая живая отправка должна пройти при человеке, а не в три ночи.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      keyword:
        description: Слова-триггеры через запятую (кусок слова тоже подходит)
        type: string
        default: skil,скил
      send:
        description: Отправить (без галочки — только посчитать)
        type: boolean
        default: false
      limit:
        description: Максимум сообщений за запуск (0 — без предела)
        type: string
        default: '0'
      posts:
        description: Сколько постов проверять с конца ленты
        type: string
        default: '25'
      debug:
        description: Показать сырой ответ API по первому посту с комментариями
        type: boolean
        default: false

concurrency:
  group: dm
  cancel-in-progress: false

jobs:
  dm:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # чтобы сохранять список отвеченных обратно в репозиторий

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Установить зависимости
        run: npm ci --omit=dev --ignore-scripts

      - name: Разобрать комментарии
        env:
          # Токен с правами на комментарии и сообщения. Отдельный от того,
          # которым публикуются рилсы, — перевыпуск не должен их ронять.
          IG_DM_TOKEN: ${{ secrets.IG_DM_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TG_BOT_URL: ${{ vars.TG_BOT_URL }}
          # Ввод формы кладём в переменные окружения, а не в тело команды:
          # подставленный в run: текст выполнился бы как часть shell-строки.
          KEYWORD: ${{ inputs.keyword }}
          LIMIT: ${{ inputs.limit }}
          SEND: ${{ inputs.send }}
          POSTS: ${{ inputs.posts }}
          DEBUG: ${{ inputs.debug }}
          EVENT: ${{ github.event_name }}
          AUTOSEND: ${{ vars.DM_AUTOSEND }}
        run: |
          # По расписанию inputs пустые — подставляем свои значения.
          # Порция в 20 человек за прогон, восемь прогонов в сутки: и очередь
          # разбирается за день, и аккаунт не выглядит рассылочной машиной.
          args=(--keyword="${KEYWORD:-skil,скил}" --limit="${LIMIT:-20}" --posts="${POSTS:-60}")
          if [[ "$EVENT" == "schedule" ]]; then
            [[ "$AUTOSEND" == "on" ]] && args+=(--send)
          else
            [[ "$SEND" == "true" ]] && args+=(--send)
          fi
          [[ "$DEBUG" == "true" ]] && args+=(--debug)
          echo "запуск: ${args[*]}"
          node src/dm.js "${args[@]}"

      - name: Отчёт по очереди
        if: always()
        run: |
          if [[ -f output/dm-queue.json ]]; then
            node -e "
              const q = require('./output/dm-queue.json');
              const rows = (a) => a.map(x => '| @' + (x.username||'—') + ' | ' + x.age_days + ' сут | ' + x.permalink + ' |').join('\n');
              const md = [
                '## Комментарии со словом «' + q.keywords.join('», «') + '»','',
                '- комментариев по счётчику Instagram: ' + q.counted,
                '- просмотрено: ' + q.scanned,
                '- можно в директ: ' + q.fresh.length,
                '- окно закрыто: ' + q.stale.length,'',
                '### Успеваем', '| кто | возраст | пост |','|---|---|---|', rows(q.fresh), '',
                '### Не успеваем — только вручную или публичным ответом',
                '| кто | возраст | пост |','|---|---|---|', rows(q.stale),
              ].join('\n');
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
            "
          fi

      - name: Запомнить, кому уже ответили
        if: always()
        run: |
          if [[ -n "$(git status --porcelain output/dm-state.json)" ]]; then
            git config user.name  "mhs-publisher"
            git config user.email "actions@github.com"
            git pull --rebase --autostash origin main
            git add output/dm-state.json
            git commit -m "директ: разослана очередная порция ответов на комментарии"
            git push
          fi
