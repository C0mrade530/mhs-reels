name: Комментарии → директ

# Instagram разрешает написать в личку только в ответ на комментарий и
# только в течение 7 суток. Поэтому разведка отделена от отправки:
# сначала смотрим, кого мы вообще ещё успеваем догнать, и лишь потом,
# отдельным запуском с галочкой, шлём сообщения.
on:
  workflow_dispatch:
    inputs:
      keyword:
        description: Слово-триггер в комментарии
        type: string
        default: skill
      send:
        description: Отправить (без галочки — только посчитать)
        type: boolean
        default: false
      limit:
        description: Максимум сообщений за запуск (0 — без предела)
        type: string
        default: '0'

concurrency:
  group: dm
  cancel-in-progress: false

jobs:
  dm:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # чтобы сохранять список отвеченных обратно в репозиторий

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Установить зависимости
        run: npm ci --omit=dev --ignore-scripts

      - name: Разобрать комментарии
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TG_BOT_URL: ${{ vars.TG_BOT_URL }}
          # Ввод формы кладём в переменные окружения, а не в тело команды:
          # подставленный в run: текст выполнился бы как часть shell-строки.
          KEYWORD: ${{ inputs.keyword }}
          LIMIT: ${{ inputs.limit }}
          SEND: ${{ inputs.send }}
        run: |
          args=(--keyword="$KEYWORD" --limit="$LIMIT")
          [[ "$SEND" == "true" ]] && args+=(--send)
          node src/dm.js "${args[@]}"

      - name: Отчёт по очереди
        if: always()
        run: |
          if [[ -f output/dm-queue.json ]]; then
            node -e "
              const q = require('./output/dm-queue.json');
              const rows = (a) => a.map(x => '| @' + (x.username||'—') + ' | ' + x.age_days + ' сут | ' + x.permalink + ' |').join('\n');
              const md = [
                '## Комментарии со словом «' + q.keyword + '»','',
                '- просмотрено: ' + q.scanned,
                '- можно в директ: ' + q.fresh.length,
                '- окно закрыто: ' + q.stale.length,'',
                '### Успеваем', '| кто | возраст | пост |','|---|---|---|', rows(q.fresh), '',
                '### Не успеваем — только вручную или публичным ответом',
                '| кто | возраст | пост |','|---|---|---|', rows(q.stale),
              ].join('\n');
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
            "
          fi

      - name: Запомнить, кому уже ответили
        if: always()
        run: |
          if [[ -n "$(git status --porcelain output/dm-state.json)" ]]; then
            git config user.name  "mhs-publisher"
            git config user.email "actions@github.com"
            git pull --rebase --autostash origin main
            git add output/dm-state.json
            git commit -m "директ: разослана очередная порция ответов на комментарии"
            git push
          fi
