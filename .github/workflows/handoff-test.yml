name: Тест передачи смены
# Проверяет, может ли встроенный GITHUB_TOKEN запустить другой workflow.
# От этого зависит, сможет ли сторож передать смену следующему запуску.
on: { workflow_dispatch: }
permissions:
  actions: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Пинг" --repo "$GITHUB_REPOSITORY"
