name: Публикация рилса

# GitHub запускает расписание с задержкой — иногда на часы, и сильнее всего
# ровно в начале часа. Поэтому просыпаемся часто и в смещённые минуты, а
# решение «пора или нет» принимает сам скрипт по московскому времени.
# Слот, опоздавший больше чем на SLOT_GRACE минут, пропускается —
# лучше не выложить, чем выложить в три ночи.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # чтобы сохранять очередь обратно в репозиторий

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Установить зависимости
        run: npm ci --omit=dev --ignore-scripts

      - name: Опубликовать следующий ролик
        env:
          # Единственный секрет, который нужно завести руками.
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # Адрес хостинга секретом не является — держим его на виду.
          # Ролики раздаёт релиз этого же репозитория: не зависит от
          # стороннего аккаунта и не затирается чужим деплоем.
          MEDIA_BASE_URL: https://github.com/C0mrade530/mhs-reels/releases/download/media-v1
          # IG_USER_ID не нужен: скрипт спросит его у API по токену.
          POST_TIMES: 12:00,15:00,18:00
        run: node src/publish.js --next --confirm --if-due

      - name: Запомнить, что опубликовано
        if: always()
        run: |
          if [[ -n "$(git status --porcelain output/publish-state.json)" ]]; then
            git config user.name  "mhs-publisher"
            git config user.email "actions@github.com"
            git pull --rebase --autostash origin main
            git add output/publish-state.json
            git commit -m "очередь: опубликован очередной ролик"
            git push
          fi
