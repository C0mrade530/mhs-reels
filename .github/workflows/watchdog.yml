name: Сторож расписания

# GitHub не выполняет расписание вовремя: крон уходил в простой на часы,
# а то и не срабатывал вовсе. Поэтому время сторожим сами.
#
# Задание живёт почти шесть часов (это потолок для одного job), каждые пять
# минут спрашивает у скрипта, не наступил ли слот, и в конце смены запускает
# себе замену. Расписание ниже — только аварийный подъём, если цепочка
# оборвалась: повторный запуск сам увидит, что смена уже идёт, и выйдет.
#
# Репозиторий публичный, минуты Actions для таких бесплатны и не ограничены,
# так что непрерывное дежурство ничего не стоит.
on:
  schedule:
    - cron: '3,33 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Установить зависимости
        run: npm ci --omit=dev --ignore-scripts

      - name: Дежурить и публиковать по слотам
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE_URL: https://github.com/C0mrade530/mhs-reels/releases/download/media-v1
          RADAR_MEDIA_BASE_URL: https://github.com/C0mrade530/mhs-reels/releases/download/media-v1
          POST_TIMES: 12:00,15:00,18:00
          RADAR_POST_TIMES: 13:00,16:00,19:00
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'private' }}
          YT_MEDIA_BASE_URL: https://github.com/C0mrade530/mhs-reels/releases/download/media-v1
          YT_POST_TIMES: 12:00,15:00,18:00
          YT_RADAR_POST_TIMES: 13:00,16:00,19:00
        run: |
          git config user.name  "mhs-publisher"
          git config user.email "actions@github.com"
          END=$(( $(date +%s) + 330 * 60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            for series in prompts radar; do
              node src/publish.js --series="$series" --next --confirm --if-due || true
              # YouTube тоже опрашиваем каждые пять минут: его собственный крон
              # GitHub запускает раз в несколько часов, и слоты терялись
              node src/youtube.js --series="$series" --next --confirm --if-due || true
            done
            if [ -n "$(git status --porcelain output/)" ]; then
              git add output/publish-state.json output/radar-publish-state.json \
                      output/youtube-state.json output/youtube-radar-state.json
              git commit -m "очередь: опубликован очередной ролик"
            fi
            # неотправленный коммит повторяем на следующем тике, иначе
            # состояние осталось бы только внутри этой смены
            if [ -n "$(git log origin/main..HEAD --oneline 2>/dev/null)" ]; then
              git pull --rebase --autostash origin main && git push \
                || echo "push не прошёл, повторю через пять минут"
            fi
            sleep 300
          done

      - name: Передать смену
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Сторож расписания" --repo "$GITHUB_REPOSITORY"
