name: Выгрузка на YouTube

# Те же ролики, что уходят в Instagram. Очередь своя, поэтому площадки
# не мешают друг другу.
#
# Квота YouTube — 10 000 единиц в сутки, одна загрузка стоит 1600, то есть
# ровно шесть роликов в день и ни одним больше. Поэтому здесь то же
# слотовое расписание, что и в Instagram: workflow будит крон, а решение
# принимает --if-due по московскому времени.
on:
  schedule:
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:
    inputs:
      series:
        description: Рубрика
        type: choice
        options: [prompts, radar]
        default: prompts
      force:
        description: Загрузить сейчас, не дожидаясь слота
        type: boolean
        default: false

concurrency:
  group: youtube
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      matrix:
        series: ${{ inputs.series && fromJSON(format('["{0}"]', inputs.series)) || fromJSON('["prompts","radar"]') }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci --omit=dev --ignore-scripts

      - name: Загрузить следующий ролик
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'private' }}
          YT_POST_TIMES: 12:00,15:00,18:00
          YT_RADAR_POST_TIMES: 13:00,16:00,19:00
          YT_MEDIA_BASE_URL: https://github.com/C0mrade530/mhs-reels/releases/download/media-v1
        run: |
          FLAGS="--next --confirm"
          [[ "${{ inputs.force }}" == "true" ]] || FLAGS="$FLAGS --if-due"
          node src/youtube.js --series=${{ matrix.series }} $FLAGS

      - name: Запомнить загруженное
        if: always()
        run: |
          F=output/youtube-state.json
          [[ "${{ matrix.series }}" == "radar" ]] && F=output/youtube-radar-state.json
          if [[ -n "$(git status --porcelain $F)" ]]; then
            git config user.name  "mhs-publisher"
            git config user.email "actions@github.com"
            git pull --rebase --autostash origin main
            git add $F && git commit -m "youtube: выгружен очередной ролик (${{ matrix.series }})"
            git push
          fi
